<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620">
  <defs>
    <radialGradient id="azul" cx="0.36" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#2C63B8"/><stop offset="0.28" stop-color="#17407F"/>
      <stop offset="0.55" stop-color="#0C2453"/><stop offset="0.8" stop-color="#071634"/>
      <stop offset="1" stop-color="#030B1C"/>
    </radialGradient>
    <!-- escovado: riscos finos girando do centro -->
    <filter id="escovado" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6 0.012" numOctaves="3" seed="7" result="ruido"/>
      <feColorMatrix in="ruido" type="saturate" values="0" result="cinza"/>
      <feComponentTransfer in="cinza" result="suave">
        <feFuncA type="linear" slope="0.06" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="suave" in2="SourceGraphic" operator="in" result="risco"/>
      <feBlend in="SourceGraphic" in2="risco" mode="overlay"/>
    </filter>
    <radialGradient id="brilhoAlto" cx="0.34" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#7FB4FF" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#3E7ACC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="310" cy="310" r="292" fill="url(#azul)" filter="url(#escovado)"/>
  <circle cx="310" cy="310" r="292" fill="url(#brilhoAlto)"/>
  <circle cx="310" cy="310" r="292" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="3"/>
</svg>
