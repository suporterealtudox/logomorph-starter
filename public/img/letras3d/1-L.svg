    <use href="#f-1-L" x="3.68" y="3.68" fill="#5c6473"/>
    <use href="#f-1-L" x="3.27" y="3.27" fill="#5f6777"/>
    <use href="#f-1-L" x="2.86" y="2.86" fill="#636b7c"/>
    <use href="#f-1-L" x="2.45" y="2.45" fill="#666f80"/>
    <use href="#f-1-L" x="2.05" y="2.05" fill="#697284"/>
    <use href="#f-1-L" x="1.64" y="1.64" fill="#6c7688"/>
    <use href="#f-1-L" x="1.23" y="1.23" fill="#707a8d"/>
    <use href="#f-1-L" x="0.82" y="0.82" fill="#737d91"/>
    <use href="#f-1-L" x="0.41" y="0.41" fill="#768195"/>
  </g>

  <!-- contorno escuro, como no desenho original -->
  <use href="#f-1-L" fill="#1E2534" stroke="#1E2534" stroke-width="3" stroke-linejoin="round"/>

  <!-- a face, com o metal e o bisel iluminado -->
  <g filter="url(#bisel-1-L)">
    <use href="#f-1-L" fill="url(#metal-1-L)"/>
  </g>

  <!-- fio de luz na aresta superior -->
  <use href="#f-1-L" fill="url(#fio-1-L)"/>
</svg>
