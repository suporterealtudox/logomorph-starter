<svg xmlns="http://www.w3.org/2000/svg" viewBox="23.24 542.57 65.49 105.51">
  <defs>
    <path id="f-1-L" d="M 53.95 559.09 C 56.15 558.57 60.55 558.73 62.68 558.81 C 64.81 558.89 64.69 558.89 62.79 568.78 C 60.89 578.68 57.21 598.48 55.41 608.39 C 53.62 618.31 53.71 618.35 53.76 618.33 C 53.80 618.31 53.80 618.23 56.90 618.23 C 59.99 618.23 66.17 618.31 69.36 618.21 C 72.55 618.11 72.73 617.84 72.27 620.08 C 71.80 622.32 70.69 627.09 70.13 629.47 C 69.58 631.85 69.58 631.85 64.52 631.89 C 59.46 631.93 49.35 632.00 44.30 632.04 C 39.24 632.08 39.24 632.08 40.94 622.42 C 42.64 612.75 46.04 593.41 47.92 582.83 C 49.80 572.24 50.16 570.41 50.46 568.88 C 50.76 567.35 51.00 566.12 51.20 565.03 C 51.40 563.93 51.56 562.96 51.65 561.88 C 51.74 560.80 51.75 559.61 53.95 559.09 Z" fill-rule="evenodd"/>

    <linearGradient id="metal-1-L" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.09" stop-color="#F2F6FC"/>
      <stop offset="0.2" stop-color="#D3DEEC"/>
      <stop offset="0.32" stop-color="#93A3B9"/>
      <stop offset="0.43" stop-color="#5A6880"/>
      <stop offset="0.5" stop-color="#3C4762"/>
      <stop offset="0.57" stop-color="#8695AC"/>
      <stop offset="0.68" stop-color="#DCE6F2"/>
      <stop offset="0.8" stop-color="#FFFFFF"/>
      <stop offset="0.9" stop-color="#B7C4D6"/>
      <stop offset="1" stop-color="#6E7B90"/>
    </linearGradient>

    <!-- Bisel: a forma borrada vira um mapa de relevo, e a luz calcula
         o brilho da aresta em cima dele. E o que da o 3D de verdade. -->
    <filter id="bisel-1-L" x="-40%" y="-40%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="relevo"/>
      <feSpecularLighting in="relevo" surfaceScale="4.5" specularConstant="1.25"
                          specularExponent="22" lighting-color="#FFFFFF" result="luz">
        <feDistantLight azimuth="228" elevation="62"/>
      </feSpecularLighting>
      <feComposite in="luz" in2="SourceAlpha" operator="in" result="luzCortada"/>
      <feComposite in="SourceGraphic" in2="luzCortada"
                   operator="arithmetic" k1="0" k2="1" k3="0.92" k4="0"/>
    </filter>

    <!-- fio de luz correndo na aresta de cima -->
    <linearGradient id="fio-1-L" x1="0" y1="0" x2="0" y2="0.4">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="sombra-1-L" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="5.0" dy="7.2" stdDeviation="3.4"
                    flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#sombra-1-L)">
    <use href="#f-1-L" x="9.00" y="9.00" fill="#32353c"/>
    <use href="#f-1-L" x="8.59" y="8.59" fill="#353840"/>
