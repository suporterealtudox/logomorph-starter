    <!-- Bisel: a forma borrada vira um mapa de relevo, e a luz calcula
         o brilho da aresta em cima dele. E o que da o 3D de verdade. -->
    <filter id="bisel-9-H" x="-40%" y="-40%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="relevo"/>
      <feSpecularLighting in="relevo" surfaceScale="4.5" specularConstant="1.25"
                          specularExponent="22" lighting-color="#FFF6DC" result="luz">
        <feDistantLight azimuth="228" elevation="62"/>
      </feSpecularLighting>
      <feComposite in="luz" in2="SourceAlpha" operator="in" result="luzCortada"/>
      <feComposite in="SourceGraphic" in2="luzCortada"
                   operator="arithmetic" k1="0" k2="1" k3="0.92" k4="0"/>
    </filter>

    <!-- fio de luz correndo na aresta de cima -->
    <linearGradient id="fio-9-H" x1="0" y1="0" x2="0" y2="0.4">
      <stop offset="0" stop-color="#FFFDF2" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFDF2" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFDF2" stop-opacity="0"/>
    </linearGradient>

    <filter id="sombra-9-H" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="5.0" dy="7.2" stdDeviation="3.4"
                    flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

